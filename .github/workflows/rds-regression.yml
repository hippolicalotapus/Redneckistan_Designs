name: RDS development regression
on:
  push:
    branches:
      - development/catalogue-retry-20261118
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-node-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original repository tests
        run: npm test
      - name: Check catalogue integrity
        run: npm run readiness
