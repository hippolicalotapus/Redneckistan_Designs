name: Node regression tests
on:
  push:
    branches:
      - development/catalogue-retry-20261118
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose checkout and runtime
        shell: bash
        run: |
          echo "Commit: $GITHUB_SHA"
          pwd
          node --version
          npm --version
          test -f package.json
          test -f catalogue/launch-27.json
          test -f tests/catalogue-retry-runtime.test.js
      - name: Run full Node suite and preserve failure output
        id: tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee node-regression.log
      - name: Upload test log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rds-node-regression-log
          path: node-regression.log
          if-no-files-found: warn
          retention-days: 7
      - name: Record result in run summary
        if: always()
        shell: bash
        run: |
          echo "## RDS Node regression" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Test outcome: ${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f node-regression.log ]; then
            echo '### Last 80 log lines' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 node-regression.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
